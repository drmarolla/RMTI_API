<svg xmlns="http://w3.org" viewBox="0 0 240 60" width="240" height="60">
  <!-- Subtle Animated Orbit Ring -->
  <circle cx="30" cy="30" r="23" fill="none" stroke="#38BDF8" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.85">
    <animateTransform attributeName="transform" type="rotate" from="0 30 30" to="360 30 30" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- 4 Vivid Animated RMTI Factor Bars (L, E, V, 1-rho) -->
  <!-- L: Electric Sky Blue -->
  <rect x="15" y="26" width="5.5" height="16" rx="2" fill="#38BDF8">
    <animate attributeName="height" values="14;19;14" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="28;23;28" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <!-- E: Luminous Crimson -->
  <rect x="23" y="17" width="5.5" height="25" rx="2" fill="#EF4444">
    <animate attributeName="height" values="25;18;25" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="17;24;17" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <!-- V: Bright Amber -->
  <rect x="31" y="21" width="5.5" height="21" rx="2" fill="#F59E0B">
    <animate attributeName="height" values="21;15;21" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="21;27;21" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <!-- 1-rho (Resilience Shield): Vivid Emerald -->
  <rect x="39" y="28" width="5.5" height="14" rx="2" fill="#10B981">
    <animate attributeName="height" values="14;9;14" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="28;33;28" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Pulsing R Signal Dot -->
  <circle cx="25.75" cy="12" r="2.8" fill="#EF4444">
    <animate attributeName="r" values="2.4;3.6;2.4" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- High-Contrast Crisp White Wordmark -->
  <text x="62" y="31" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="900" font-size="23" letter-spacing="1.2" fill="#FFFFFF">RMTI</text>
  <text x="63" y="45" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="700" font-size="8.5" letter-spacing="0.9" fill="#38BDF8">RISK MECHANISM THEORY INDEX</text>
</svg>

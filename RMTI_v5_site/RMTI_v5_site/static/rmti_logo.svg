<svg xmlns="http://w3.org" viewBox="0 0 240 60" width="240" height="60">
  <style>
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @keyframes bar1 { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.25); } }
    @keyframes bar2 { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.75); } }
    .orbit { transform-origin: 30px 30px; animation: spin 14s linear infinite; }
    .dot { animation: pulse 2s ease-in-out infinite; }
    .b1 { transform-origin: 17.75px 42px; animation: bar1 2.8s ease-in-out infinite; }
    .b2 { transform-origin: 25.75px 42px; animation: bar2 2.8s ease-in-out infinite; }
    .b3 { transform-origin: 33.75px 42px; animation: bar1 2.8s ease-in-out 0.6s infinite; }
    .b4 { transform-origin: 41.75px 42px; animation: bar2 2.8s ease-in-out 0.6s infinite; }
  </style>
  <circle class="orbit" cx="30" cy="30" r="23" fill="none" stroke="#38BDF8" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.85"/>
  <rect class="b1" x="15" y="26" width="5.5" height="16" rx="2" fill="#38BDF8"/>
  <rect class="b2" x="23" y="17" width="5.5" height="25" rx="2" fill="#EF4444"/>
  <rect class="b3" x="31" y="21" width="5.5" height="21" rx="2" fill="#F59E0B"/>
  <rect class="b4" x="39" y="28" width="5.5" height="14" rx="2" fill="#10B981"/>
  <circle class="dot" cx="25.75" cy="12" r="2.8" fill="#EF4444"/>
  <text x="62" y="31" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="23" letter-spacing="1.2" fill="#FFFFFF">RMTI</text>
  <text x="63" y="45" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="8.5" letter-spacing="0.9" fill="#38BDF8">RISK MECHANISM THEORY INDEX</text>
</svg>

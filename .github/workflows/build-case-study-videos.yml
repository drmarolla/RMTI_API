name: Build 3D Case Study Videos

on:
  push:
    branches: [main]
    paths:
      - "assets/raw/**"
      - "tools/build_3d_case_studies.py"
      - ".github/workflows/build-case-study-videos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Python Plotting Libraries
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install matplotlib numpy
      - name: Assemble 3D Case Study MP4s
        run: python tools/build_3d_case_studies.py
      - name: Commit finished MP4s to assets/videos/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          git add assets/videos/*.mp4
          if ! git diff --staged --quiet; then
            git commit -m "chore(videos): build 3D case study MP4s [skip ci]"
            git push
          fi

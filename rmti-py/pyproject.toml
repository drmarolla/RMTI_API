[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rmti-py"            # "rmti" is already taken on PyPI by another project
version = "3.2.0"
description = "Risk Mechanism Theory Index (RMTI): scoring, uncertainty, geospatial exposure and portfolio optimisation, with urban-resilience and HCC-surveillance domains."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Cesar Marolla", email = "cesar.marolla@alumni.harvard.edu" }]
keywords = ["risk", "RMTI", "resilience", "disaster risk", "hepatocellular carcinoma", "decision support"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.22", "scipy>=1.9"]   # scipy.optimize.milp needs >=1.9

[project.optional-dependencies]
geo = ["geopandas>=0.14", "shapely>=2.0", "rasterio>=1.3", "rasterstats>=0.19", "pandas>=1.5"]
sat = ["rmti-py[geo]", "pystac-client>=0.7", "xarray>=2023.1", "dask[array]>=2023.1"]
pc = ["rmti-py[sat]", "planetary-computer>=1.0"]
gee = ["rmti-py[geo]", "earthengine-api>=0.1.380"]
viz = ["folium>=0.15", "pillow>=10"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "pandas>=1.5", "httpx>=0.26"]
app = ["rmti-py[geo,viz]", "streamlit>=1.50"]
dev = ["pytest>=7", "httpx>=0.26"]
all = ["rmti-py[sat,viz,api,app,dev]"]

[project.scripts]
rmti = "rmti.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rmti = ["data/*.csv", "data/sample/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
